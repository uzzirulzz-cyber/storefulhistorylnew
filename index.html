    <!-- Google Analytics 4 (GA4) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-J3DJM463ZH"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());
      gtag('config', 'G-J3DJM463ZH');
      // SPA route tracking: fire page_view on every client-side navigation
      (function () {
        var lastPath = null;
        function trackSpaPage() {
          var path = window.location.pathname + window.location.search + window.location.hash;
          if (path === lastPath) return;
          lastPath = path;
          gtag('event', 'page_view', {
            page_title: document.title,
            page_location: window.location.href,
            page_path: window.location.pathname + window.location.search,
          });
        }
        var origPush = history.pushState;
        history.pushState = function () {
          origPush.apply(this, arguments);
          trackSpaPage();
        };
        var origReplace = history.replaceState;
        history.replaceState = function () {
          origReplace.apply(this, arguments);
          trackSpaPage();
        };
        window.addEventListener('popstate', trackSpaPage);
        window.addEventListener('hashchange', trackSpaPage);
      })();
    </script>
